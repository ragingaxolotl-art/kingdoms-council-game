name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-classroom.cjs
      - run: node tests/tactical-battle.cjs
      - run: node tests/tactical-multiplayer.mjs
      - run: node tests/movement-encounters.cjs
      - run: node tests/movement-waves.cjs
      - run: node tests/encounter-choices.cjs
      - run: node tests/infantry-equipment.cjs
      - run: node tests/production-improvements.cjs
      - run: node tests/map-visibility-captures.cjs
      - run: node tests/regiment-movement.cjs
      - run: node tests/battle-lab.cjs
      - run: node tests/battle-online.mjs
      - run: node tests/shared-rules.mjs
      - run: node tests/movement-permissions.mjs
      - run: node tests/engine.cjs
      - run: node tests/phases.cjs
      - run: node tests/economy.cjs
      - run: node tests/military.cjs
      - run: node tests/research.cjs
      - run: node tests/objectives.cjs
      - run: node tests/migration.cjs
      - run: node tests/campaign.cjs
      - run: node tests/development.cjs
      - run: node tests/society.cjs
      - run: node tests/regiments.cjs
      - run: node tests/regiment-economy.cjs
      - run: node tests/regiment-happiness.cjs
      - run: node tests/regiment-map-orders.cjs
      - run: node tests/map-navigation.cjs
      - run: node tests/regiment-settlements.cjs
      - run: node tests/regiment-shared-capture.cjs
      - run: node tests/regiment-development.cjs
      - run: node tests/regiment-objectives.cjs
      - run: node tests/regiment-objectives-balance.cjs
      - run: node tests/regiment-disruption.cjs
      - run: node tests/releases.cjs
      - run: node scripts/build-classroom.cjs
      - run: node tests/classroom-session.cjs
      - run: node tests/classroom-neutral.cjs
      - run: node tests/classroom-outbox.cjs
      - run: node tests/classroom-api.mjs
      - run: node tests/classroom-storage.mjs
      - run: node tests/classroom-supabase-store.mjs
      - run: node tests/food-plan.cjs
      - run: node tests/retreat-map.cjs
      - run: node tests/research-investments.cjs
      - run: node tests/student-map-biomes.cjs
      - run: node tests/research-categories.cjs
      - run: node tests/allocation-controls.cjs
      - run: node tests/facility-map.cjs
      - run: node tests/student-site.cjs
      - run: node tests/economy-reserves.cjs
      - run: node tests/resource-display.cjs
      - run: node tests/department-budget.cjs
      - run: node tests/teacher-auth.mjs
      - run: node tests/classroom-auth.cjs
      - run: node scripts/check-live-rules.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
